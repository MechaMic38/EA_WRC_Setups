name: ${COMPOSE_PROJECT_NAME:-ea_wrc_setups}

services:
    php:
        build:
            context: .
            dockerfile: ./docker/php.dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.3}
        working_dir: /var/www/html
        networks:
            - app_network


    nginx:
        build:
            context: .
            dockerfile: ./docker/nginx.dockerfile
            args:
                NGINX_VERSION: ${NGINX_VERSION:-stable}
        depends_on:
            - php
        networks:
            - app_network


networks:
    app_network:
        driver: bridge
