
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://localhost

      DB_CONNECTION: mongodb
      DB_URI: mongodb://127.0.0.1:27017
      DB_DATABASE: ea_wrc_setups_test

      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      PUBLIC_STORAGE_DRIVER: local
      BCRYPT_ROUNDS: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, bz2, gd, gmp, intl, mbstring, mongodb-1.19.0, pdo_mysql, soap, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Prepare Laravel environment
        working-directory: src
        run: cp .env.example .env

      - name: Validate Composer configuration
        working-directory: src
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        working-directory: src
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        working-directory: src
        run: php artisan key:generate --force

      - name: Install frontend dependencies
        working-directory: src
        run: npm ci

      - name: Build frontend
        working-directory: src
        run: npm run build

      - name: Run PHPUnit suite
        working-directory: src
        run: php artisan test

      - name: Build production Docker image
        run: docker build -f docker/production.dockerfile -t ea-wrc-setups:ci .
