services:
    # Extend the shared PHP service for local development
    php:
        volumes:
            - ${PATH_TO_CODE:-./src}:/var/www/html
        depends_on:
            - mongodb


    # Extend the shared Nginx service for local development
    nginx:
        ports:
            - ${HTTP_ON_HOST:-8080}:80
        volumes:
            - ${PATH_TO_CODE:-./src}:/var/www/html


    # Local development database
    mongodb:
        image: mongodb/mongodb-atlas-local:${MONGO_VERSION:-7.0}
        hostname: mongodb
        restart: unless-stopped
        ports:
            - ${MONGO_ON_HOST:-27017}:27017
        volumes:
            - mongodb_data:/data/db
            - mongodb_configdb:/data/configdb
            - mongodb_mongot:/data/mongot
        ulimits:
            nofile:
                soft: 64000
                hard: 64000
        environment:
            MONGODB_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?Set MONGO_USERNAME in .env}
            MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
            DO_NOT_TRACK: "1"
        networks:
            - app_network


    # Vite development server for hot module replacement (HMR)
    vite:
        image: node:${NODE_VERSION:-20}
        ports:
            - ${VITE_ON_HOST:-5173}:5173
        volumes:
            - ${PATH_TO_CODE:-./src}:/var/www/html
        working_dir: /var/www/html
        entrypoint: ["npm"]
        command: ["run", "dev"]
        depends_on:
            - php
        networks:
            - app_network


    # Development tools: invoke them on demand
    composer:
        build:
            context: .
            dockerfile: ./docker/php.dockerfile
            args:
                - PHP_VERSION=${PHP_VERSION:-8.3}
        profiles:
            - tools
        volumes:
            - ${PATH_TO_CODE:-./src}:/var/www/html
        working_dir: /var/www/html
        entrypoint: ["php", "/usr/bin/composer"]
        networks:
            - app_network


    artisan:
        build:
            context: .
            dockerfile: ./docker/php.dockerfile
            args:
                - PHP_VERSION=${PHP_VERSION:-8.3}
        profiles:
            - tools
        volumes:
            - ${PATH_TO_CODE:-./src}:/var/www/html
        working_dir: /var/www/html
        entrypoint: ["php", "artisan"]
        networks:
            - app_network


    npm:
        image: node:${NODE_VERSION:-20}
        profiles:
            - tools
        volumes:
            - ${PATH_TO_CODE:-./src}:/var/www/html
        working_dir: /var/www/html
        entrypoint: ["npm"]
        networks:
            - app_network


    # Local readiness notification
    sonar:
        build:
            context: .
            dockerfile: ./docker/sonar.dockerfile
        depends_on:
            - php
            - nginx
        networks:
            - app_network


volumes:
    mongodb_data:
    mongodb_configdb:
    mongodb_mongot:
