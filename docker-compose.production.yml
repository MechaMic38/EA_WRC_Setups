services:
    # These are part of the development architecture
    # Disable them when using the combined production image
    php:
        profiles:
            - development


    nginx:
        profiles:
            - development


    # Production application: PHP-Apache + Laravel
    app:
        image: ea-wrc-setups:production
        build:
            context: .
            dockerfile: ./docker/production.dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.3}
                NODE_VERSION: ${NODE_VERSION:-20}
        restart: unless-stopped
        ports:
            - "${APP_PORT:-10000}:10000"
        environment:
            APP_NAME: "EA WRC Setups"
            APP_ENV: production
            APP_DEBUG: "false"
            APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
            APP_URL: ${APP_URL:-http://localhost:10000}

            LOG_CHANNEL: stderr

            DB_CONNECTION: mongodb
            DB_URI: ${DB_URI:?Set DB_URI in .env.production}
            DB_DATABASE: ${DB_DATABASE:-ea_wrc_setups}

            # Suitable starting defaults for a temporary showcase.
            SESSION_DRIVER: file
            CACHE_STORE: file
            QUEUE_CONNECTION: sync

            FILESYSTEM_DISK: public
            PUBLIC_STORAGE_DRIVER: ${PUBLIC_STORAGE_DRIVER:-s3}

            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
            AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
            AWS_BUCKET: ${AWS_BUCKET:?Set AWS_BUCKET}
            AWS_ENDPOINT: ${AWS_ENDPOINT:?Set AWS_ENDPOINT}
            AWS_URL: ${AWS_URL:?Set AWS_URL}
            AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}

            ADMIN_NAME: ${ADMIN_NAME:?Set ADMIN_NAME in .env.production}
            ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env.production}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.production}
        networks:
            - app_network
